<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        body {
            background-color: #120024;
            overflow: hidden;
            touch-action: none;
        }

        .pixel-bg {
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        .gravity-field {
            height: 100px;
            background: linear-gradient(transparent, #7000FF55, #7000FF);
            mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M0 50 Q 25 0 50 50 T 100 50 V 100 H 0 Z" fill="black"/></svg>');
            mask-repeat: repeat-x;
            mask-size: 50% 100%;
            animation: wave 4s infinite linear;
        }

        @keyframes wave {
            from { mask-position: 0 0; }
            to { mask-position: 200% 0; }
        }

        /* Float effects */
        @keyframes platformFloat {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }

        .platform-floating {
            animation: platformFloat 3s ease-in-out infinite;
        }

        @keyframes powerupHover {
            0% { transform: translate(-50%, -10px); }
            50% { transform: translate(-50%, -20px); }
            100% { transform: translate(-50%, -10px); }
        }

        .powerup-hover {
            animation: powerupHover 2s ease-in-out infinite;
        }

        /* Pulsing Glows */
        @keyframes shieldPulse {
            0% { box-shadow: 0 0 15px 5px rgba(112, 0, 255, 0.4); }
            50% { box-shadow: 0 0 30px 15px rgba(0, 163, 255, 0.7); }
            100% { box-shadow: 0 0 15px 5px rgba(112, 0, 255, 0.4); }
        }

        .shield-glow {
            border-radius: 50%;
            animation: shieldPulse 2.5s ease-in-out infinite;
        }

        @keyframes indicatorPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pulse-active {
            animation: indicatorPulse 1s ease-in-out infinite;
        }

        /* Screen Shake */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .screen-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Particles */
        .particle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 25;
            animation: particleOut 1s forwards;
        }

        @keyframes particleOut {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(0); opacity: 0; }
        }

        .platform {
            box-shadow: 0 0 10px #7000FF;
        }

        .spike {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .pushed-state:active {
            transform: translateY(2px);
        }

        .kiro-jump-animation {
            animation: bounce 0.6s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-40px); }
        }

        .glow-text {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        @media (prefers-reduced-motion: reduce) {
            .kiro-jump-animation, .platform-floating, .powerup-hover, .shield-glow, .pulse-active, .screen-shake, .wave, .gravity-field, .particle {
                animation: none !important;
                transition: none !important;
            }
        }

<!-- Interaction Script -->
<script>
    const kiroContainer = document.getElementById('kiro-container');
    const mainCanvas = document.getElementById('game-canvas');
    const shieldIndicator = document.getElementById('shield-indicator');

    // Particle generator
    function createPowerUpParticles() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const rect = kiroContainer.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        for (let i = 0; i < 3; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            // Randomize size and sparkle type
            const size = Math.random() * 4 + 4;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            
            // Random direction
            const angle = Math.random() * Math.PI * 2;
            const dist = 50 + Math.random() * 100;
            const tx = Math.cos(angle) * dist;
            const ty = Math.sin(angle) * dist;
            
            particle.style.setProperty('--tw-translate-x', `${tx}px`);
            particle.style.setProperty('--tw-translate-y', `${ty}px`);
            
            // Shield theme colors (blue/white/purple)
            const colors = ['#fff', '#00A3FF', '#7000FF'];
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            particle.style.left = centerX + 'px';
            particle.style.top = centerY + 'px';
            
            document.body.appendChild(particle);
            
            setTimeout(() => particle.remove(), 1000);
        }
    }

    // Continuous particles while active
    setInterval(createPowerUpParticles, 200);

    // Jump micro-interaction
    const jumpBtn = document.querySelector('button');
    jumpBtn.addEventListener('mousedown', () => {
        kiroContainer.style.animation = 'none';
        
        // Trigger screen shake on large action
        shieldIndicator.classList.remove('screen-shake');
        void shieldIndicator.offsetWidth; // Force reflow
        shieldIndicator.classList.add('screen-shake');

        setTimeout(() => {
            kiroContainer.style.transition = 'transform 0.4s cubic-bezier(0.22, 1, 0.36, 1)';
            kiroContainer.style.transform = 'translateY(-300px) scale(1.1)';
            
            setTimeout(() => {
                kiroContainer.style.transform = 'translateY(0) scale(1)';
                setTimeout(() => {
                    kiroContainer.style.animation = 'bounce 0.6s infinite alternate cubic-bezier(0.45, 0, 0.55, 1)';
                    kiroContainer.style.transition = 'none';
                }, 400);
            }, 800);
        }, 10);
    });

    // Environment particles (Ambient)
    setInterval(() => {
        const particle = document.createElement('div');
        const size = Math.random() * 4 + 2;
        particle.style.position = 'absolute';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.bottom = '-10px';
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.background = '#7000FF';
        particle.style.opacity = '0.4';
        particle.style.zIndex = '10';
        particle.style.transition = 'all 3s linear';
        mainCanvas.appendChild(particle);

        setTimeout(() => {
            particle.style.transform = `translateY(-${Math.random() * 400 + 200}px) scale(0)`;
            particle.style.opacity = '0';
        }, 50);

        setTimeout(() => particle.remove(), 3050);
    }, 400);
</script>
