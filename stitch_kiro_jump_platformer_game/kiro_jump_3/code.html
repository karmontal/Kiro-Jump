        .gravity-field {
            height: 100px;

            mask-repeat: repeat-x;
            mask-size: 50% 100%;
            animation: wave 4s infinite linear;
        }

        @keyframes wave {
            from { mask-position: 0 0; }
            to { mask-position: 200% 0; }
        }

        .platform {
            box-shadow: 0 0 10px #7000FF;
        }

        .spike {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .pushed-state:active {
            transform: translateY(2px);
        }

        .kiro-jump-animation {
            animation: bounce 0.6s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-40px); }
        }

<!-- Interaction Script -->
<script>
        // Simple micro-interaction for the jump button
        const jumpBtn = document.querySelector('button');
        jumpBtn.addEventListener('mousedown', () => {
            const kiro = document.querySelector('.kiro-jump-animation');
            kiro.style.animation = 'none';
            setTimeout(() => {
                kiro.style.transition = 'transform 0.4s cubic-bezier(0.22, 1, 0.36, 1)';
                kiro.style.transform = 'translateY(-300px) scale(1.2)';
                
                // Return after jump
                setTimeout(() => {
                    kiro.style.transform = 'translateY(0) scale(1)';
                    setTimeout(() => {
                        kiro.style.animation = 'bounce 0.6s infinite alternate cubic-bezier(0.45, 0, 0.55, 1)';
                        kiro.style.transition = 'none';
                    }, 400);
                }, 1000);
            }, 10);
        });

        // Floating particle effect generator
        const main = document.querySelector('main');
        setInterval(() => {
            const particle = document.createElement('div');
            const size = Math.random() * 4 + 2;
            particle.style.position = 'absolute';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.bottom = '-10px';
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.background = '#7000FF';
            particle.style.opacity = '0.6';
            particle.style.zIndex = '10';
            particle.style.transition = 'all 3s linear';
            main.appendChild(particle);

            setTimeout(() => {
                particle.style.transform = `translateY(-${Math.random() * 400 + 200}px) scale(0)`;
                particle.style.opacity = '0';
            }, 50);

            setTimeout(() => {
                particle.remove();
            }, 3050);
        }, 300);
    </script>
